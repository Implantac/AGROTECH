services:
  super-agtech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super_agtech_production
    restart: always
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
