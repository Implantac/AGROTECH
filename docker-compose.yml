services:
  super-agtech-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: super_agtech_production
    restart: always
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - JWT_SECRET=super_agro_jwt_secret_2026_xyz
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
