<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#112319" />
    <meta name="description" content="AGROTECH - O sistema operacional da empresa rural: Gestão de Fazendas, Telemetria CAN Bus, MIP, DRE, Reforma Tributária e LCDPR Oficial" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AgroTech" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Tipografia Moderna, Humanizada & Orgânica para o Agro (Plus Jakarta Sans + Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />

    <title>AGROTECH • O Sistema Operacional da Empresa Rural</title>
  </head>
  <body class="bg-[#F8FAF6] text-[#122117] font-sans antialiased selection:bg-[#1D6F42] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro do Service Worker para Operação 100% Offline no Campo (Apenas fora de iframes)
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http') && window.self === window.top) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('[PWA] Service Worker registrado com sucesso no escopo:', reg.scope);
            })
            .catch((err) => {
              console.log('[PWA] Falha ao registrar Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
