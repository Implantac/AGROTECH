version: '3.8'

services:
  # Banco de Dados Principal: PostgreSQL 16 com PostGIS 3.4 e TimescaleDB
  postgres-agro:
    image: postgis/postgis:16-3.4
    container_name: agro_postgres
    restart: always
    environment:
      POSTGRES_DB: super_agtech_db
      POSTGRES_USER: agro_admin
      POSTGRES_PASSWORD: agro_secure_password_2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata_agro:/var/lib/postgresql/data
      - ./migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro_admin -d super_agtech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Mensageria Assíncrona: RabbitMQ 3 com fila persistente e DLX
  rabbitmq-agro:
    image: rabbitmq:3.12-management-alpine
    container_name: agro_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: agro_rabbit
      RABBITMQ_DEFAULT_PASS: agro_rabbit_pass_2026
    ports:
      - "5672:5672"   # Protocolo AMQP para ingestão Go e NestJS
      - "15672:15672" # Dashboard de Gerenciamento Web
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Cache de Sessão e Trava Distribuída: Redis 7
  redis-agro:
    image: redis:7-alpine
    container_name: agro_redis
    restart: always
    command: redis-server --requirepass agro_redis_pass_2026 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Microsserviço de Ingestão de Alta Velocidade: Go Gateway
  sync-gateway-go:
    build:
      context: ../services/sync-gateway
      dockerfile: Dockerfile
    container_name: agro_sync_gateway
    restart: always
    environment:
      PORT: 8080
      RABBITMQ_URL: amqp://agro_rabbit:agro_rabbit_pass_2026@rabbitmq-agro:5672/
      DATABASE_URL: postgres://agro_admin:agro_secure_password_2026@postgres-agro:5432/super_agtech_db
      JWT_SECRET: super_agro_jwt_secret_2026_xyz
    ports:
      - "8080:8080"
    depends_on:
      postgres-agro:
        condition: service_healthy
      rabbitmq-agro:
        condition: service_started

  # Backend Core ERP e Regras Fiscais: Node.js / NestJS
  core-erp-nestjs:
    build:
      context: ../services/core-erp
      dockerfile: Dockerfile
    container_name: agro_core_erp
    restart: always
    environment:
      PORT: 3001
      DATABASE_URL: postgres://agro_admin:agro_secure_password_2026@postgres-agro:5432/super_agtech_db
      RABBITMQ_URL: amqp://agro_rabbit:agro_rabbit_pass_2026@rabbitmq-agro:5672/
      REDIS_URL: redis://:agro_redis_pass_2026@redis-agro:6379
      SEFAZ_ENV: homologacao
    ports:
      - "3001:3001"
    depends_on:
      postgres-agro:
        condition: service_healthy

volumes:
  pgdata_agro:
  rabbitmq_data:
  redis_data:
