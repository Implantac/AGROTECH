# ==============================================================================
# AGROTECH ENTERPRISE — CONFIGURAÇÃO NGINX REVERSO COM SSL & WEBSOCKET/SSE
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name sistema.suafazenda.com.br app.suafazenda.com.br;

    # Redirecionamento forçado para HTTPS seguro
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sistema.suafazenda.com.br app.suafazenda.com.br;

    # Certificados SSL Let's Encrypt (gerados automaticamente via Certbot)
    ssl_certificate /etc/letsencrypt/live/sistema.suafazenda.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sistema.suafazenda.com.br/privkey.pem;

    # Protocolos e Cifras Modernas (TLS 1.2 e TLS 1.3 com alta segurança)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AgroSSL:10m;
    ssl_session_tickets off;

    # Limite de tamanho de upload para GeoJSON, SHP do CAR e XMLs fiscais
    client_max_body_size 64M;

    # Compressão Gzip para aceleração em conexões rurais (3G / Starlink)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeçalhos de Segurança HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rota de Streaming Server-Sent Events (SSE) para Telemetria em Tempo Real
    location /api/v1/telemetria/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Desabilita buffer para entrega instantânea de frames CAN Bus
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Proxy Principal para a Aplicação e APIs REST
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Cache de Ativos Estáticos (PWA, Imagens, JS e CSS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
